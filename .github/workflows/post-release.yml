name: Post-release smoke

# After Publish images promoted X.Y.Z, pull those tags from GHCR and start the production
# Compose stack on the runner with `just prod::up`, the recipe an operator runs, then read
# /live through the proxy. It never builds an image: a failure here means the published
# set does not start, not that the source does not build.

on:
  workflow_run:
    workflows: [Publish images]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published release version without the leading v (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: none

concurrency:
  group: post-release-${{ github.event.workflow_run.head_sha || inputs.version }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Published images smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      COSTURA_SMOKE_PROJECT: costura-post-release
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/tags/v{0}', inputs.version) }}
          persist-credentials: false
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$(tr -d '[:space:]' < version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: $version" >&2; exit 1; }
          [[ "$(tr -d '[:space:]' < version.txt)" == "$version" ]] || { echo "version.txt does not say $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the published release with just prod::up
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          env_file=$(mktemp)
          echo "env_file=$env_file" >> "$GITHUB_ENV"
          smoke_names=$(bash scripts/smoke-env.sh "$env_file")
          # shellcheck disable=SC2086
          unset $smoke_names || true
          sed -i "s/^COSTURA_VERSION=.*/COSTURA_VERSION=$VERSION/" "$env_file"
          export COSTURA_COMPOSE="docker compose --env-file $env_file -p $COSTURA_SMOKE_PROJECT -f docker-compose.prod.yml"
          export COSTURA_ENV_FILE="$env_file"
          just --dotenv-path "$env_file" prod::up
          just --dotenv-path "$env_file" prod::ps
      - name: Check /live through the proxy
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          live=$(curl -sS -f -H "Host: localhost" http://127.0.0.1:18080/live)
          python3 -c 'import json,sys; body=json.loads(sys.argv[1]); assert body.get("status")=="ok", body' "$live"
          echo "proxy /live $live"
          for image in costura-api costura-web costura-proxy; do
            docker image inspect "ghcr.io/costuraai/$image:$VERSION" --format '{{.RepoDigests}}'
          done
      - name: Show the stack on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${env_file:-}" ]] || exit 0
          docker compose --env-file "$env_file" -p "$COSTURA_SMOKE_PROJECT" -f docker-compose.prod.yml ps || true
          docker compose --env-file "$env_file" -p "$COSTURA_SMOKE_PROJECT" -f docker-compose.prod.yml logs --no-color --tail 100 || true
      - name: Remove the stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${env_file:-}" ]] || exit 0
          docker compose --env-file "$env_file" -p "$COSTURA_SMOKE_PROJECT" -f docker-compose.prod.yml down -v --remove-orphans || true
          rm -f "$env_file"
