name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Skip until the release token exists
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::RELEASE_PLEASE_TOKEN is not set; release-please is skipped."
      - name: Create or update the release pull request
        if: env.HAS_TOKEN == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A GITHUB_TOKEN release does not trigger publish-images.yml, and its pull request
          # gets no CI run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
