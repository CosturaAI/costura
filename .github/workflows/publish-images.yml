name: Publish images

# Each image is built for amd64 and arm64 and pushed only under its source tag sha-<commit>.
# Both architectures are scanned and attested. The smoke job starts those sha-<commit>
# candidates with `just prod::up`, the recipe an operator runs. The release tags (X.Y.Z and
# latest) move in one promote job only after every image passed and the smoke passed, so a
# release never points at a partial or unstartable set. The bundle job then attaches
# costura-X.Y.Z.tar.gz, the Docker-only install, to the release.

on:
  release:
    types: [published]

permissions:
  contents: none

concurrency:
  group: publish-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: costuraai

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve the version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: $RELEASE_TAG" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/v$version" >> "$GITHUB_OUTPUT"
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.ref }}
          persist-credentials: false
      - name: Check the tag carries that version
        id: sha
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(tr -d '[:space:]' < version.txt)" == "$VERSION" ]] || { echo "version.txt does not say $VERSION" >&2; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
            image: costura-api
          - name: web
            context: .
            file: apps/web/Dockerfile
            image: costura-web
          - name: proxy
            context: deploy
            file: deploy/proxy.Dockerfile
            image: costura-proxy
    env:
      CANDIDATE: ghcr.io/costuraai/${{ matrix.image }}:sha-${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push the source tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.CANDIDATE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ env.CANDIDATE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ env.CANDIDATE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Release candidate smoke
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      COSTURA_SMOKE_PROJECT: costura-post-release
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the sha-tagged candidates with just prod::up
        shell: bash
        env:
          VERSION: sha-${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          env_file=$(mktemp)
          echo "env_file=$env_file" >> "$GITHUB_ENV"
          smoke_names=$(bash scripts/smoke-env.sh "$env_file")
          # shellcheck disable=SC2086
          unset $smoke_names || true
          sed -i "s/^COSTURA_VERSION=.*/COSTURA_VERSION=$VERSION/" "$env_file"
          export COSTURA_COMPOSE="docker compose --env-file $env_file -p $COSTURA_SMOKE_PROJECT -f docker-compose.prod.yml"
          export COSTURA_ENV_FILE="$env_file"
          just --dotenv-path "$env_file" prod::up
          just --dotenv-path "$env_file" prod::ps
      - name: Check /live through the proxy
        shell: bash
        env:
          VERSION: sha-${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          live=$(curl -sS -f -H "Host: localhost" http://127.0.0.1:18080/live)
          python3 -c 'import json,sys; body=json.loads(sys.argv[1]); assert body.get("status")=="ok", body' "$live"
          echo "proxy /live $live"
          for image in costura-api costura-web costura-proxy; do
            docker image inspect "$REGISTRY/$OWNER/$image:$VERSION" --format '{{.RepoDigests}}'
          done
      - name: Show the stack on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${env_file:-}" ]] || exit 0
          docker compose --env-file "$env_file" -p "$COSTURA_SMOKE_PROJECT" -f docker-compose.prod.yml ps || true
          docker compose --env-file "$env_file" -p "$COSTURA_SMOKE_PROJECT" -f docker-compose.prod.yml logs --no-color --tail 100 || true
      - name: Remove the stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${env_file:-}" ]] || exit 0
          docker compose --env-file "$env_file" -p "$COSTURA_SMOKE_PROJECT" -f docker-compose.prod.yml down -v --remove-orphans || true
          rm -f "$env_file"

  promote:
    name: Promote the release tags
    needs: [resolve, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag X.Y.Z and latest on every image
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          for image in costura-api costura-web costura-proxy; do
            ref="$REGISTRY/$OWNER/$image"
            docker buildx imagetools create --tag "$ref:$VERSION" --tag "$ref:latest" "$ref:sha-$SHA"
          done

  bundle:
    name: Attach the Docker-only bundle
    needs: [resolve, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Build the bundle and attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          bash scripts/release-bundle.sh "$VERSION" "$out"
          gh release upload "$TAG" "$out/costura-$VERSION.tar.gz" "$out/costura-$VERSION.tar.gz.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
