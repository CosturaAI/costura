# Version updates for the ecosystems this repository pins: once a week, one grouped pull
# request per ecosystem. GitHub security updates and alerts are repository settings
# (Settings -> Code security and analysis), described in SECURITY.md, and are not
# configured in this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Actions are pinned to a commit SHA with the version in a comment; Dependabot keeps both.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    groups:
      javascript:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directories: ["/apps/api", "/apps/web", "/deploy"]
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      compose:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
