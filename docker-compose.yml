# Local development database only. The supported single-node install is
# docker-compose.prod.yml (docs/operations/install.md).

services:
  postgres:
    # postgres:18-alpine (18.6-alpine3.24; Postgres 19 is still beta)
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Values are interpolated from the repo-root .env; only these three reach the container.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${COSTURA_DEV_DB_PORT:-5432}:5432"
    volumes:
      - costura_pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  costura_pgdata:
